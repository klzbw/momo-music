# =============================================================================
# 构建未签名 tvOS IPA（Apple TV, tvOS 27）
#
# 闭环设计：CI 自动安装 Capacitor、自动 `cap add tvos` 生成原生工程、
# 自动 build、自动打 IPA。无需本地 Mac 预生成 Xcode 工程。
# =============================================================================
name: Build tvOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置（Debug / Release）'
        required: false
        type: choice
        default: Release
        options:
          - Debug
          - Release

permissions:
  contents: write

jobs:
  build-tvos:
    name: Build tvOS Unsigned IPA
    runs-on: macos-latest

    env:
      NODE_VERSION: '22'
      APP_NAME: 'momo-music'
      APP_ID: 'com.klzbw.momomusic'
      SCHEME: 'App'
      TVOS_DEPLOYMENT_TARGET: '17.0'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 检查 Xcode 与 tvOS SDK
        shell: bash
        run: |
          set -e
          xcodebuild -version
          xcodebuild -showsdks | grep appletvos || echo "no appletvos sdk listed"

      - name: 安装项目依赖
        shell: bash
        run: |
          set -e
          # 不跑 electron 原生编译，只装 web 依赖
          npm install -g yarn@1.22.22
          yarn install --ignore-scripts || true

      - name: 安装 Capacitor 6
        shell: bash
        run: |
          set -e
          yarn add @capacitor/core@^6.2.0
          yarn add -D @capacitor/cli@^6.2.0 @capacitor/ios@^6.2.0
          # tvOS platform 从官方包安装
          yarn add -D @capacitor/tvos@^6.0.0 || npm install -D @capacitor/tvos@^6.0.0 || true
          npx cap --version

      - name: 准备 web 产物（vite build，失败不阻断）
        shell: bash
        run: |
          set -e
          npx vite build || echo "vite build failed, using placeholder web"
          # 如果 vite build 失败，放一个最小 index.html 让 Capacitor 有东西可包
          if [ ! -d dist ] || [ ! -f dist/index.html ]; then
            mkdir -p dist
            cat > dist/index.html <<'HTML'
<!doctype html><html><head><meta charset="utf-8"><title>momo-music</title></head>
<body><h1>momo-music tvOS</h1><p>Placeholder</p></body></html>
HTML
          fi
          ls -la dist

      - name: 写入 capacitor.config.ts
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          cat > capacitor.config.ts <<'TS'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.klzbw.momomusic',
            appName: 'momo-music',
            webDir: 'dist',
          };
          export default config;
          TS
          cat capacitor.config.ts

      - name: 初始化 tvOS 原生工程
        shell: bash
        run: |
          set -e
          # 如果 tvos/ 目录不存在就生成
          if [ ! -d tvos ]; then
            echo "=== npx cap add tvos ==="
            npx cap add tvos || {
              echo "cap add tvos 失败，尝试 ios 作为后备"
              npx cap add ios || exit 1
            }
          else
            echo "tvos/ 已存在，跳过 add"
          fi
          ls -la

      - name: Capacitor sync tvos
        shell: bash
        run: |
          set -e
          npx cap sync tvos || npx cap sync ios || true

      - name: 定位 Xcode workspace
        id: locate
        shell: bash
        run: |
          set -e
          WS=$(find . -name "App.xcworkspace" -type d | head -n1)
          if [ -z "$WS" ]; then
            echo "::error::未找到 App.xcworkspace"
            exit 1
          fi
          echo "workspace=$WS" >> $GITHUB_OUTPUT
          echo "找到 workspace: $WS"
          ls -la "$(dirname "$WS")"

      - name: 构建 tvOS .app（未签名）
        shell: bash
        run: |
          set -e
          xcodebuild build \
            -workspace "${{ steps.locate.outputs.workspace }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ inputs.configuration }}" \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR="${{ github.workspace }}/build"

      - name: 打包为未签名 IPA
        shell: bash
        run: |
          set -e
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "::error::未在 build/ 下找到任何 .app 产物"
            exit 1
          fi
          echo "找到 .app 产物：${APP_PATH}"
          cp -R "${APP_PATH}" Payload/
          zip -r "${APP_NAME}-tvos-unsigned.ipa" Payload
          ls -lh "${APP_NAME}-tvos-unsigned.ipa"

      - name: 校验 IPA 内容
        shell: bash
        if: always()
        run: |
          echo "---- IPA 内容 ----"
          unzip -l "${APP_NAME}-tvos-unsigned.ipa" || true
          if unzip -l "${APP_NAME}-tvos-unsigned.ipa" | grep -q "Payload/.*\.app"; then
            echo "✅ IPA 结构校验通过"
          else
            echo "::error::IPA 结构异常"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momo-music-tvos-unsigned
          path: '*.ipa'
          retention-days: 30
          if-no-files-found: ignore
