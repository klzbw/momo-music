# =============================================================================
# 构建未签名 tvOS IPA（Apple TV, tvOS 27）
#
# 说明：
#   1. 本工作流在 macOS runner 上构建【未签名】的 tvOS .ipa，
#      产物仅用于侧载（sideload）测试，不经过苹果正式签名。
#   2. 未签名 IPA 无法直接安装到非越狱 Apple TV，
#      需通过 AltStore / Sideloadly 等工具侧载，或在越狱设备上安装。
#   3. 首次运行前，必须先在本机 Mac 上手动执行：
#         npx cap add tvos
#      以生成原生工程（ios/App/App.xcworkspace），并将其提交到仓库；
#      否则本工作流找不到工程文件会直接失败。
#   4. tvOS 27 需要 Xcode 26 及以上版本；macos-latest 已预装 Xcode 26 满足要求，
#      如需锁定构建环境可改用 macos-15。
# =============================================================================
name: Build tvOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置（Debug / Release）'
        required: false
        type: choice
        default: Release
        options:
          - Debug
          - Release
      upload_release:
        description: '是否将 IPA 上传为 GitHub Release 草稿'
        required: false
        type: boolean
        default: false

# 上传 Release 需要 contents 写权限
permissions:
  contents: write

jobs:
  build-tvos:
    name: Build tvOS Unsigned IPA
    # tvOS 27 需 Xcode 26+，macos-latest 已满足；如需锁定可改为 macos-15
    runs-on: macos-latest

    env:
      NODE_VERSION: '22'
      APP_NAME: 'momo-music'
      SCHEME: 'App'
      TVOS_DEPLOYMENT_TARGET: '27.0'

    steps:
      - name: 检出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 安装 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: 检查 Xcode 与 tvOS SDK 版本
        shell: bash
        run: |
          set -e
          xcodebuild -version
          echo "---- 可用 tvOS SDK ----"
          xcodebuild -showsdks | grep appletvos || true

      - name: 安装 Node 依赖
        shell: bash
        run: |
          set -e
          if [ -f yarn.lock ]; then
            yarn install --frozen-lockfile
          else
            echo "未找到 yarn.lock，回退到 yarn install"
            yarn install
          fi

      - name: 构建前端资源（vite build）
        shell: bash
        run: |
          set -e
          npx vite build
          ls -lh dist || true

      - name: 安装 Capacitor CLI（如本地未提供）
        shell: bash
        run: |
          set -e
          if npx --no-install cap --version >/dev/null 2>&1; then
            echo "使用项目内 Capacitor CLI："
            npx cap --version
          else
            echo "项目内未找到 Capacitor CLI，全局安装最新版"
            npm install -g @capacitor/cli@latest
            cap --version
          fi

      - name: 同步 Capacitor tvOS 工程（自动执行 pod install）
        shell: bash
        run: |
          set -e
          npx cap sync tvos

      - name: 构建 tvOS .app（未签名）
        shell: bash
        run: |
          set -e
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ inputs.configuration }}" \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR="${{ github.workspace }}/build"

      - name: 打包为未签名 IPA
        shell: bash
        run: |
          set -e
          mkdir -p Payload
          # 先定位实际产出的 .app（可能在 build/Release-appletvos 或 build/Debug-appletvos）
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "::error::未在 build/ 下找到任何 .app 产物"
            exit 1
          fi
          echo "找到 .app 产物：${APP_PATH}"
          cp -R "${APP_PATH}" Payload/
          zip -r "${APP_NAME}-tvos-unsigned.ipa" Payload
          ls -lh "${APP_NAME}-tvos-unsigned.ipa"

      - name: 校验 IPA 内容
        shell: bash
        if: always()
        run: |
          echo "---- IPA 内容预览（前 20 行）----"
          unzip -l "${APP_NAME}-tvos-unsigned.ipa" | head -20 || true
          # 必须存在 Payload/*.app
          if unzip -l "${APP_NAME}-tvos-unsigned.ipa" | grep -q "Payload/.*\.app/$"; then
            echo "✅ IPA 结构校验通过：Payload/ 下存在 .app"
          else
            echo "::error::IPA 中未找到 Payload/*.app，结构异常"
            exit 1
          fi

      - name: 上传构建产物（IPA）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momo-music-tvos-unsigned
          path: '*.ipa'
          retention-days: 30
          if-no-files-found: ignore

      - name: 生成 Release 标签
        if: ${{ inputs.upload_release }}
        shell: bash
        run: |
          DATE_TAG=$(date +'%Y%m%d%H%M')
          echo "RELEASE_TAG=v-tvos-unsigned-${DATE_TAG}" >> "$GITHUB_ENV"

      - name: 上传到 GitHub Release（草稿）
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
        with:
          files: '*.ipa'
          draft: true
          prerelease: false
          tag_name: ${{ env.RELEASE_TAG }}
