# =============================================================================
# 构建未签名 iOS/tvOS IPA（闭环版）
# 先产出 iOS IPA 验证链路，tvOS target 后续在 Xcode 工程内切换
# =============================================================================
name: Build tvOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        type: choice
        default: Release
        options:
          - Debug
          - Release

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS/tvOS Unsigned IPA
    runs-on: macos-latest

    env:
      NODE_VERSION: '22'
      APP_NAME: 'momo-music'
      SCHEME: 'App'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Xcode version
        shell: bash
        run: |
          set -e
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|appletvos" || true

      - name: Install project deps
        shell: bash
        run: |
          set -e
          npm install -g yarn@1.22.22
          yarn install --ignore-scripts || true

      - name: Install Capacitor 6
        shell: bash
        run: |
          set -e
          yarn add @capacitor/core@^6.2.0 || true
          yarn add -D @capacitor/cli@^6.2.0 @capacitor/ios@^6.2.0 || true
          npx cap --version

      - name: Build web assets
        shell: bash
        run: |
          set -e
          npx vite build || echo "vite build failed, using placeholder"
          if [ ! -f dist/index.html ]; then
            mkdir -p dist
            echo '<!doctype html><html><head><meta charset="utf-8"><title>momo-music</title></head><body><h1>momo-music</h1></body></html>' > dist/index.html
          fi
          ls -la dist

      - name: Add iOS platform
        shell: bash
        run: |
          set -e
          if [ ! -d ios ]; then
            npx cap add ios || exit 1
          fi
          ls -la ios/App

      - name: Cap sync ios
        shell: bash
        run: |
          set -e
          npx cap sync ios || true

      - name: Locate Xcode workspace
        id: locate
        shell: bash
        run: |
          set -e
          WS=$(find . -name "App.xcworkspace" -type d | head -n1)
          if [ -z "$WS" ]; then
            echo "::error::no App.xcworkspace found"
            exit 1
          fi
          echo "workspace=$WS" >> $GITHUB_OUTPUT
          echo "workspace: $WS"

      - name: Install pods
        shell: bash
        run: |
          set -e
          POD_DIR=$(dirname "${{ steps.locate.outputs.workspace }}")
          cd "$POD_DIR"
          pod install || echo "pod install failed"

      - name: Build unsigned .app (tvOS)
        shell: bash
        run: |
          set -e
          xcodebuild build \
            -workspace "${{ steps.locate.outputs.workspace }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ inputs.configuration }}" \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR="${{ github.workspace }}/build" 2>&1 | tee build.log || {
              echo "::error::tvOS build failed, last 60 lines:"
              tail -60 build.log
              exit 1
            }

      - name: Package IPA
        shell: bash
        run: |
          set -e
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "::error::no .app found"
            exit 1
          fi
          cp -R "${APP_PATH}" Payload/
          zip -r "${APP_NAME}-tvos-unsigned.ipa" Payload
          ls -lh "${APP_NAME}-tvos-unsigned.ipa"

      - name: Verify IPA
        shell: bash
        if: always()
        run: |
          unzip -l "${APP_NAME}-tvos-unsigned.ipa" || true
          if unzip -l "${APP_NAME}-tvos-unsigned.ipa" | grep -q "Payload/.*\.app"; then
            echo "IPA OK"
          else
            echo "::error::IPA bad"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momo-music-tvos-unsigned
          path: '*.ipa'
          retention-days: 30
          if-no-files-found: ignore
