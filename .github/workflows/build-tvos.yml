# =============================================================================
# 构建未签名 tvOS IPA（独立 WKWebView 工程，不依赖 Capacitor）
# =============================================================================
name: Build tvOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        type: choice
        default: Release
        options:
          - Debug
          - Release

permissions:
  contents: write

jobs:
  build-tvos:
    name: Build tvOS Unsigned IPA
    runs-on: macos-latest

    env:
      NODE_VERSION: '22'
      APP_NAME: 'momo-music'
      SCHEME: 'momo-music'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Xcode version
        shell: bash
        run: |
          set -e
          xcodebuild -version
          xcodebuild -showsdks | grep appletvos

      - name: Install project deps
        shell: bash
        run: |
          set -e
          npm install -g yarn@1.22.22
          yarn install --ignore-scripts || true

      - name: Build web assets
        shell: bash
        run: |
          set -e
          npx vite build || echo "vite build failed, using placeholder"
          if [ ! -f dist/index.html ]; then
            mkdir -p dist
            echo '<!doctype html><html><head><meta charset="utf-8"><title>momo-music</title></head><body style="background:#000;color:#fff"><h1>momo-music</h1></body></html>' > dist/index.html
          fi
          ls -la dist

      - name: Create tvOS Xcode project
        shell: bash
        run: |
          set -e
          gem install xcodeproj --no-document
          mkdir -p build_tvos
          ruby scripts/create_tvos_project.rb build_tvos dist "${APP_NAME}"
          ls -la build_tvos

      - name: Build tvOS .app
        shell: bash
        run: |
          set -e
          xcodebuild build \
            -project "build_tvos/${APP_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration "${{ inputs.configuration }}" \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            BUILD_DIR="${{ github.workspace }}/build" 2>&1 | tee build.log || {
              echo "::error::tvOS build failed, last 80 lines:"
              tail -80 build.log
              exit 1
            }

      - name: Package IPA
        shell: bash
        run: |
          set -e
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          if [ -z "${APP_PATH}" ]; then
            echo "::error::no .app found"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          ls -la "$APP_PATH"
          cp -R "${APP_PATH}" Payload/
          zip -r "${APP_NAME}-tvos-unsigned.ipa" Payload
          ls -lh "${APP_NAME}-tvos-unsigned.ipa"

      - name: Verify IPA
        shell: bash
        if: always()
        run: |
          unzip -l "${APP_NAME}-tvos-unsigned.ipa" || true
          if unzip -l "${APP_NAME}-tvos-unsigned.ipa" | grep -q "Payload/.*\.app"; then
            echo "IPA OK"
          else
            echo "::error::IPA bad"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momo-music-tvos-unsigned
          path: '*.ipa'
          retention-days: 30
          if-no-files-found: ignore
